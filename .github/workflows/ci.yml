name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel an in-flight run when a branch is pushed again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Race-detector unit sweep on Linux and macOS. gofmt and vet run here too so a
  # formatting slip fails fast on both platforms. unagi is pure Go with no cgo, so
  # nothing extra needs installing first. This runs -short: the compile-heavy
  # suites (the conformance corpus and the static-tier probes) are the slow part
  # and link one throwaway binary per case, so they run in the dedicated sharded
  # corpus job below instead of under the race detector on every platform. What
  # stays here is the fast unit suite under -race, including the platform-specific
  # runtime code that only these two OSes exercise.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt -s -w:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test -race -short -count=1 -timeout=20m -coverprofile=coverage.out ./...
      - name: coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -func=coverage.out | tail -1

  # Compile-heavy conformance corpus, sharded across parallel Linux jobs. Each
  # fixture links one throwaway binary, times the forced-tier and double-compile
  # reruns, so a single runner outgrows any sane time budget as the corpus grows.
  # UNAGI_TEST_SHARD makes each job build a disjoint slice (by a stable hash of
  # the fixture name), so wall time stays flat as fixtures are added: widen the
  # shard count, not the timeout. build_jobs lifts the per-runner build cap to 4
  # so the warm cache is exercised in parallel. The child fixture builds are not
  # race-instrumented, so the corpus runs without -race; the compiler packages it
  # drives keep their race coverage in the test job above. Shard 0 also carries
  # the emit/ir/build static-tier probes, which are few and not worth sharding.
  corpus:
    strategy:
      fail-fast: false
      matrix:
        shard: ["0/4", "1/4", "2/4", "3/4"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: corpus shard
        env:
          UNAGI_TEST_SHARD: ${{ matrix.shard }}
          UNAGI_TEST_BUILD_JOBS: "4"
        run: go test -count=1 -timeout=30m ./pkg/conformance/
      - name: static-tier probes
        if: matrix.shard == '0/4'
        env:
          UNAGI_TEST_BUILD_JOBS: "4"
        run: go test -count=1 -timeout=20m ./pkg/emit/ ./pkg/ir/ ./pkg/build/

  # Windows build, test, and run. The runtime compiles for windows/amd64 (#760),
  # so this lane builds the whole module, runs every package suite that is green
  # on Windows, and compiles-and-runs a program through the run driver as an end
  # to end smoke, which exercises the Windows-specific .exe output handling. The
  # unix-only modules (posix, select, socket, signal, pwd, grp) are tagged out on
  # Windows and their remaining ports are tracked in #760, so their suites are
  # not part of this lane yet.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: build
        run: go build ./...
      - name: test
        run: go test -count=1 ./pkg/objects/... ./pkg/frontend/... ./pkg/lower/... ./pkg/runtime/...
      - name: run a program end to end
        run: |
          "print('hello from windows ci')" | Out-File -Encoding ascii hello.py
          go run ./cmd/unagi run hello.py

  # The differential oracle: replay every oracle.golden against real CPython so
  # the goldens can never drift from the interpreter. The subject-vs-golden
  # comparison happens in the test job above and needs no Python. The Python
  # version here must match conformance/ORACLE_PIN; the pin moves in its own PR.
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14.6"
      - name: goldens match CPython
        env:
          UNAGI_ORACLE: "1"
        run: go test -count=1 -run TestCorpusGoldenFresh ./pkg/conformance/

  # The doc 06 section 9.3 determinism gate. Partition decisions and the Go the
  # compiler emits from them must be a pure function of the source: same input,
  # byte-identical output, every machine, every time. The build cache keys and
  # the checked-in emitted-code reviews rest on it. This job runs the ordering-
  # hazard partition tests and the double-build byte comparison as their own
  # named check, so a nondeterminism regression is legible here instead of
  # buried in the general test run. It builds Go modules, so it does not run in
  # -short.
  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: partition and double-build determinism
        run: go test -count=1 -run 'Determinis|FeedOrder|StableAcrossManyRuns|DoubleBuild' ./pkg/partition/ ./pkg/build/

  # golangci-lint bundles staticcheck, govet, ineffassign, errcheck, unused and
  # more, so it is the main quality gate.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: latest

  # Scan the module and its dependencies for known vulnerabilities.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # Confirm go.mod and go.sum are tidy: a PR that adds an import without running
  # go mod tidy fails here instead of breaking a later release.
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  # Prove the zero-cgo cross-compile story: unagi is pure Go, so it should build
  # for every target GoReleaser ships with CGO_ENABLED=0 and no per-OS
  # toolchain. A change that pulls in cgo (or code that only builds on one OS)
  # fails here instead of at release time.
  cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: freebsd, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: build ${{ matrix.target.goos }}/${{ matrix.target.goarch }}
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: "0"
        run: go build -o /dev/null ./cmd/unagi
